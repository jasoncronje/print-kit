name: Bug report
description: Something broke or gave a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for, what you got, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Ask Claude to "run the print-kit doctor" and paste what it prints.
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer and nozzle
      placeholder: Prusa MK4, 0.4 mm
  - type: input
    id: slicer
    attributes:
      label: Slicer
      placeholder: OrcaSlicer 2.2
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error text, a screenshot, or the .scad file if you can share it.
